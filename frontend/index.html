<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Personal Finance Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <h2>Personal Finance Manager</h2>

        <button id="logoutBtn">Logout</button>

    </header>


    <main class="dashboard">

        <h1 id="welcomeMessage">Welcome</h1>


        <!-- Summary Cards -->

        <section class="summary-container">

            <div class="summary-card">
                <h3>Total Income</h3>
                <p id="totalIncome">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="totalExpense">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Balance</h3>
                <p id="balance">₹0</p>
            </div>

        </section>

        <!-- Add Transaction Section -->

        <section class="transaction-forms">

            <!-- Add Income -->

            <div class="form-card">

                <h2>Add Income</h2>

                <form id="incomeForm">

                    <div class="form-group">
                        <label for="incomeAmount">Amount</label>
                        <input type="number" id="incomeAmount" placeholder="Enter amount" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="incomeSource">Source</label>
                        <input type="text" id="incomeSource" placeholder="Salary, Freelancing..." required>
                    </div>

                    <div class="form-group">
                        <label for="incomeDescription">Description</label>
                        <input type="text" id="incomeDescription" placeholder="Optional description">
                    </div>

                    <div class="form-group">
                        <label for="incomeDate">Date</label>
                        <input type="date" id="incomeDate" required>
                    </div>

                    <button type="submit">Add Income</button>

                    <p id="incomeMessage"></p>

                </form>

            </div>


            <!-- Add Expense -->

            <div class="form-card">

                <h2>Add Expense</h2>

                <form id="expenseForm">

                    <div class="form-group">
                        <label for="expenseAmount">Amount</label>
                        <input type="number" id="expenseAmount" placeholder="Enter amount" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="expenseCategory">Category</label>

                        <select id="expenseCategory" required>

                            <option value="">Select category</option>

                            <option value="1">Food</option>
                            <option value="2">Rent</option>
                            <option value="3">Shopping</option>
                            <option value="4">Travel</option>
                            <option value="5">Bills</option>
                            <option value="6">Education</option>
                            <option value="7">Entertainment</option>
                            <option value="8">Healthcare</option>
                            <option value="9">Transportation</option>
                            <option value="10">Other</option>

                        </select>

                    </div>

                    <div class="form-group">
                        <label for="expenseDescription">Description</label>
                        <input type="text" id="expenseDescription" placeholder="Optional description">
                    </div>

                    <div class="form-group">
                        <label for="expenseDate">Date</label>
                        <input type="date" id="expenseDate" required>
                    </div>

                    <button type="submit">Add Expense</button>

                    <p id="expenseMessage"></p>

                </form>

            </div>

        </section>
        <!-- Recent Transactions -->

        <section class="transactions">

            <div class="transaction-section">

                <h2>Recent Income</h2>

                <div id="incomeList">
                    <p>No income records yet.</p>
                </div>

            </div>


            <div class="transaction-section">

                <h2>Recent Expenses</h2>

                <div id="expenseList">
                    <p>No expense records yet.</p>
                </div>

            </div>

        </section>

    </main>


    <script src="js/main.js"></script>

</body>

</html>
